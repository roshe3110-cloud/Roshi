  <line x1="300" y1="275" x2="300" y2="340" stroke="url(#gold)" stroke-width="1.5" />

  <!-- Sparkling Star Accents -->
  <path d="M200 230 Q200 250 180 250 Q200 250 200 270 Q200 250 220 250 Q200 250 200 230 Z" fill="#D4A45E" opacity="0.8" />
  <path d="M400 260 Q400 275 385 275 Q400 275 400 290 Q400 275 415 275 Q400 275 400 260 Z" fill="#D4A45E" opacity="0.8" />
  <circle cx="215" cy="420" r="4" fill="#D4A45E" opacity="0.6" />
  <circle cx="390" cy="410" r="4" fill="#D4A45E" opacity="0.6" />

  <!-- Typography -->
  <text x="300" y="550" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#704638" text-anchor="middle" letter-spacing="3">FINE &amp; WATERPROOF JEWELRY</text>
  <text x="300" y="585" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#D4A45E" text-anchor="middle" letter-spacing="2">18K GOLD PLATED · ANTI-TARNISH</text>

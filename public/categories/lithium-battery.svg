  <text x="400" y="660" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="3">LITHIUM BATTERIES</text>
  <text x="400" y="705" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="2">LIFEPO4 · 6000+ CYCLES · ENERGY STORAGE</text>

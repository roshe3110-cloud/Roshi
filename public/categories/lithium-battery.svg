    <!-- Charge level bars -->
    <rect x="-48" y="35" width="96" height="16" rx="4" fill="url(#emeraldGold)" opacity="0.9" />
    <rect x="-48" y="10" width="96" height="16" rx="4" fill="url(#emeraldGold)" opacity="0.75" />
    <rect x="-48" y="-15" width="96" height="16" rx="4" fill="url(#emeraldGold)" opacity="0.6" />
    <rect x="-48" y="-40" width="96" height="16" rx="4" fill="url(#emeraldGold)" opacity="0.45" />

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 750" width="100%" height="100%">
  <defs>
    <linearGradient id="box-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F4EF" />
      <stop offset="50%" stop-color="#FAF3EB" />
      <stop offset="100%" stop-color="#EBD5C5" />
    </linearGradient>
    <linearGradient id="silver-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E2E8F0" />
      <stop offset="70%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <linearGradient id="gold-acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D194" />
      <stop offset="50%" stop-color="#D4A45E" />
      <stop offset="100%" stop-color="#9E7333" />
    </linearGradient>
    <linearGradient id="velvet-interior" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4DCD8" />
      <stop offset="100%" stop-color="#E5C7C1" />
    </linearGradient>
  </defs>

  <rect width="600" height="750" fill="url(#box-bg)" />
  
  <!-- Backdrop circle -->
  <circle cx="300" cy="340" r="145" fill="#FFFFFF" stroke="#D4A45E" stroke-width="2" opacity="0.95" />

  <!-- Jewelry Box Casket Silhouette (Silver Simple Keepsake) -->
  <!-- Box Base -->
  <rect x="200" y="320" width="200" height="110" rx="16" fill="url(#silver-metal)" stroke="#94A3B8" stroke-width="2" />
  <!-- Velvet inner lining illusion -->
  <rect x="210" y="330" width="180" height="90" rx="10" fill="url(#velvet-interior)" />
  
  <!-- Ring & Earring Pillows inside box -->
  <line x1="225" y1="355" x2="280" y2="355" stroke="#D4A45E" stroke-width="5" stroke-linecap="round" />
  <line x1="225" y1="375" x2="280" y2="375" stroke="#D4A45E" stroke-width="5" stroke-linecap="round" />
  <line x1="225" y1="395" x2="280" y2="395" stroke="#D4A45E" stroke-width="5" stroke-linecap="round" />
  
  <!-- Necklace hook compartments -->
  <rect x="300" y="345" width="75" height="60" rx="6" fill="#FFFFFF" stroke="#D4A45E" stroke-width="1.5" opacity="0.8" />
  <circle cx="337" cy="365" r="10" fill="none" stroke="url(#gold-acc)" stroke-width="3" />

  <!-- Box Open Lid (Angled Perspective) -->
  <path d="M196 322 L220 220 L380 220 L404 322 Z" fill="url(#silver-metal)" stroke="#94A3B8" stroke-width="2" />
  <!-- Mirror in lid -->
  <polygon points="230,232 370,232 388,312 212,312" fill="#FFFFFF" stroke="#D4A45E" stroke-width="1.5" opacity="0.9" />
  <!-- Mirror Glint -->
  <line x1="250" y1="245" x2="330" y2="300" stroke="#F4DCD8" stroke-width="3" stroke-linecap="round" opacity="0.8" />

  <!-- Gold Clasp / Lock -->
  <rect x="288" y="316" width="24" height="20" rx="4" fill="url(#gold-acc)" stroke="#704638" stroke-width="1" />
  <circle cx="300" cy="326" r="3" fill="#704638" />

  <!-- Sparkles -->
  <path d="M175 240 Q175 255 160 255 Q175 255 175 270 Q175 255 190 255 Q175 255 175 240 Z" fill="#D4A45E" opacity="0.8" />
  <path d="M425 250 Q425 265 410 265 Q425 265 425 280 Q425 265 440 265 Q425 265 425 250 Z" fill="#94A3B8" opacity="0.8" />

  <!-- Typography -->
  <text x="300" y="550" font-family="'Outfit', sans-serif" font-size="28" font-weight="800" fill="#704638" text-anchor="middle" letter-spacing="3">JEWELRY BOXES &amp; CASES</text>
  <text x="300" y="585" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#D4A45E" text-anchor="middle" letter-spacing="2">SILVER SIMPLE · KEEPSAKE ORGANIZERS</text>
</svg>

